/* ---------------- UA / client signal parsing ---------------- */
function parseUA(ua){
  ua=ua||'';
  let browser='Other';
  if(/Edg\//.test(ua))browser='Edge';else if(/OPR\/|Opera/.test(ua))browser='Opera';
  else if(/Chrome\//.test(ua)&&!/Chromium/.test(ua))browser='Chrome';else if(/Firefox\//.test(ua))browser='Firefox';
  else if(/Safari\//.test(ua)&&/Version\//.test(ua))browser='Safari';else if(/bot|crawl|spider|slurp/i.test(ua))browser='Bot/Crawler';
  let os='Other';
  if(/Windows NT/.test(ua))os='Windows';else if(/Mac OS X/.test(ua)&&!/Mobile/.test(ua))os='macOS';
  else if(/Android/.test(ua))os='Android';else if(/iPhone|iPad|iPod/.test(ua))os='iOS';else if(/Linux/.test(ua))os='Linux';
  let device='desktop';
  if(/iPad|Tablet/.test(ua))device='tablet';else if(/Mobile|iPhone|Android/.test(ua))device='mobile';
  if(/bot|crawl|spider/i.test(ua))device='bot';
  return{browser,os,device};
}

/* ---------------- destination URL validation (SSRF/open-redirect guard) ---------------- */
function validateDestination(raw){
  if(!raw||typeof raw!=='string')return{ok:false,error:'Destination URL is required.'};
  if(raw.length>2048)return{ok:false,error:'URL exceeds the 2048-character limit.'};
  let u;try{u=new URL(raw)}catch{return{ok:false,error:'Malformed URL. Include the full https:// address.'}}
  if(!['http:','https:'].includes(u.protocol))return{ok:false,error:`Scheme “${u.protocol.replace(':','')}” is not allowed. Only http/https.`};
  const h=u.hostname.toLowerCase();
  if(['localhost','127.0.0.1','0.0.0.0','::1','[::1]'].includes(h)||h.endsWith('.local')||h.endsWith('.internal'))
    return{ok:false,error:'Localhost and internal hostnames are not allowed.'};
  if(/^\d+\.\d+\.\d+\.\d+$/.test(h)){
    if(/^(10\.|127\.|0\.|169\.254\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.)/.test(h))
      return{ok:false,error:'Private / reserved network addresses are blocked (SSRF protection).'};
  }
  const badTld=/\.(onion|i2p)$/;if(badTld.test(h))return{ok:false,error:'This destination network is not supported.'};
  return{ok:true,url:u.href,domain:h};
}

function pageHead(t,d,extra=''){return`<div class="flex flex-wrap items-start justify-between gap-3 mb-6"><div><h1 class="text-[22px] font-extrabold tracking-tight">${t}</h1><p class="text-[13.5px] text-ink-500 dark:text-ink-400 mt-1 max-w-2xl">${d}</p></div><div class="flex gap-2">${extra}</div></div>`}
function statCard(icon,label,value,sub,color='brand'){const c={brand:'bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400',emerald:'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600',violet:'bg-violet-50 dark:bg-violet-500/10 text-violet-600',amber:'bg-amber-50 dark:bg-amber-500/10 text-amber-600',rose:'bg-rose-50 dark:bg-rose-500/10 text-rose-600',sky:'bg-sky-50 dark:bg-sky-500/10 text-sky-600'}[color];
  return`<div class="card p-4.5 p-5 flex items-start gap-3.5"><div class="stat-ic ${c}">${ic(icon,'w-[18px] h-[18px]')}</div>
  <div class="min-w-0"><div class="text-[11px] font-bold uppercase tracking-wider text-ink-400">${label}</div>
  <div class="text-[22px] font-extrabold tracking-tight mt-0.5 truncate">${value}</div>
  <div class="text-[11.5px] text-ink-400 mt-0.5 truncate">${sub}</div></div></div>`}
const typeBadge=t=>({short_url:'<span class="badge bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-300">Short URL</span>',pixel:'<span class="badge bg-violet-50 dark:bg-violet-500/10 text-violet-600 dark:text-violet-300">Pixel</span>',geolocation:'<span class="badge bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-300">Geolocation</span>'}[t]);
const statusBadge=l=>{const exp=l.expiresAt&&l.expiresAt<Date.now();
  if(l.status==='disabled')return'<span class="badge bg-rose-50 dark:bg-rose-500/10 text-rose-600">Disabled</span>';
  if(l.status==='removed')return'<span class="badge bg-ink-100 dark:bg-ink-800 text-ink-500">Removed</span>';
  if(exp)return'<span class="badge bg-amber-50 dark:bg-amber-500/10 text-amber-600">Expired</span>';
  return'<span class="badge bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600">Active</span>'};
const DOMAINS=['https://okurl.my','https://goingviral.my'];
const baseOf=l=>(l&&l.baseUrl)||location.origin;
const shortURL=l=>baseOf(l)+'/#/r/'+l.slug;
const geoURL=l=>baseOf(l)+'/#/g/'+l.slug;
const domainField=()=>{const cur=DOMAINS.includes(location.origin)?location.origin:DOMAINS[0];

const emptyState=(icon,t,d,btn='')=>`<div class="card p-12 text-center"><div class="stat-ic bg-ink-100 dark:bg-ink-800 text-ink-400 mx-auto mb-4 !w-12 !h-12">${ic(icon,'w-6 h-6')}</div>

  const uniq=new Set(inR.map(e=>e.visitorToken)).size;
  const today=evs.filter(e=>e.occurredAt>=Date.now()-day).length;
  const geoEvs=db.geoEvents.filter(g=>links.some(l=>l.id===g.trackingLinkId)).length;
  const topC=Object.entries(inR.reduce((m,e)=>(m[e.country]=(m[e.country]||0)+1,m),{})).sort((a,b)=>b[1]-a[1])[0];
  const content=`
  ${pageHead('Overview','Your tracking resources and traffic at a glance.',`<button onclick="location.hash='#/app/urls'" class="btn-primary px-4 py-2 text-[13px]">${ic('zap','w-4 h-4')}New tracking link</button>`)}
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5 mb-6">
    ${statCard('chart','Total requests',fmt(inR.length),`across ${links.length} link${links.length===1?'':'s'}`)}
    ${statCard('users','Est. unique visitors',fmt(uniq),'privacy-preserving daily tokens','violet')}
    ${statCard('zap','Requests today',fmt(today),'rolling 24 hours','emerald')}
    ${statCard('pin','Consent location events',fmt(geoEvs),'explicit GPS shares only','sky')}
  </div>
  <div class="grid lg:grid-cols-3 gap-4 mb-6">
    <div class="card p-5 lg:col-span-2"><div class="flex items-center justify-between mb-4"><h3 class="font-bold text-[14.5px]">Traffic — last ${ui.range} days</h3>
      <span class="text-[11.5px] text-ink-400">requests · unique estimate</span></div><div class="h-60"><canvas id="ovChart"></canvas></div></div>
    <div class="card p-5"><h3 class="font-bold text-[14.5px] mb-4">Devices</h3><div class="h-44"><canvas id="ovDev"></canvas></div>
      <div class="mt-4 pt-4 border-t border-ink-100 dark:border-ink-800 text-[12.5px] space-y-2">
        <div class="flex justify-between"><span class="text-ink-500">Top country</span><b>${topC?esc(topC[0]):'—'}</b></div>
        <div class="flex justify-between"><span class="text-ink-500">Pending reports</span><b>${db.reports.filter(r=>r.status==='pending').length}</b></div>
        <div class="flex justify-between"><span class="text-ink-500">Retention default</span><b>${me().settings.retentionDays} days</b></div></div></div>
  </div>
  <div class="card"><div class="flex items-center justify-between px-5 py-4 border-b border-ink-100 dark:border-ink-800"><h3 class="font-bold text-[14.5px]">Your tracking links</h3>
    <a href="#/app/urls" class="text-[12.5px] font-semibold text-brand-600 hover:underline">Manage all →</a></div>
    ${links.length?`<div class="divide-y divide-ink-100 dark:divide-ink-800">${links.slice(0,5).map(linkRow).join('')}</div>`

function agg(evs,key){const m={};evs.forEach(e=>{const k=typeof key==='function'?key(e):e[key]??'Unknown';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}

  <div class="h-1.5 rounded-full bg-ink-100 dark:bg-ink-800"><div class="h-1.5 rounded-full ${color}" style="width:${(v/max*100).toFixed(1)}%"></div></div></div>`).join('')||'<p class="text-[12.5px] text-ink-400">No data in range.</p>'}

/* -------- charts -------- */
function chartColors(){const dark=document.documentElement.classList.contains('dark');return{grid:dark?'rgba(148,163,184,.1)':'rgba(15,23,42,.06)',tick:dark?'#64748b':'#94a3b8'}}
function buildTimeline(id,evs,prev=null){
  const el=document.getElementById(id);if(!el||typeof Chart==='undefined')return;
  const cc=chartColors();const days=ui.range;const labels=[],req=[],unq=[],prevA=[];
  for(let i=days-1;i>=0;i--){const d=new Date(Date.now()-i*day);const key=d.toDateString();
    labels.push(d.toLocaleDateString(undefined,{month:'short',day:'numeric'}));
    const dayEvs=evs.filter(e=>new Date(e.occurredAt).toDateString()===key);
    req.push(dayEvs.length);unq.push(new Set(dayEvs.map(e=>e.visitorToken)).size);
    if(prev)prevA.push(prev.filter(e=>new Date(e.occurredAt).toDateString()===new Date(Date.now()-(i+days)*day).toDateString()).length);}
  const ds=[{label:'Requests',data:req,borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,.12)',fill:true,tension:.35,pointRadius:0,borderWidth:2},
    {label:'Est. unique',data:unq,borderColor:'#8b5cf6',borderDash:[5,4],tension:.35,pointRadius:0,borderWidth:1.8,fill:false}];
  if(prev)ds.push({label:'Previous period',data:prevA,borderColor:'#cbd5e1',borderDash:[3,4],tension:.35,pointRadius:0,borderWidth:1.5,fill:false});
  charts.push(new Chart(el,{type:'line',data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{labels:{color:cc.tick,boxWidth:10,font:{size:11}}}},
    scales:{x:{grid:{color:cc.grid},ticks:{color:cc.tick,maxTicksLimit:8,font:{size:10.5}}},y:{grid:{color:cc.grid},ticks:{color:cc.tick,font:{size:10.5}},beginAtZero:true}}}}));
}
function buildDoughnut(id,evs){
  const el=document.getElementById(id);if(!el||typeof Chart==='undefined')return;
  const rows=agg(evs,'deviceType');const cc=chartColors();
  charts.push(new Chart(el,{type:'doughnut',data:{labels:rows.map(r=>r[0]),datasets:[{data:rows.map(r=>r[1]),backgroundColor:['#6366f1','#8b5cf6','#34d399','#f59e0b'],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{position:'bottom',labels:{color:cc.tick,boxWidth:9,font:{size:11}}}}}}));
}
function buildMap(l,evs,geoEvs){
  const el=document.getElementById('map');if(!el||typeof L==='undefined')return;
  leafletMap=L.map(el,{zoomControl:true,attributionControl:true}).setView([20,10],2);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:10,attribution:'© OpenStreetMap'}).addTo(leafletMap);
  const byCity=agg(evs.filter(e=>e.lat!=null),e=>[e.city,e.lat.toFixed(2),e.lng.toFixed(2),e.countryCode].join('|'));
  byCity.forEach(([k,v])=>{const[city,lat,lng,cc]=k.split('|');
    L.circleMarker([+lat,+lng],{radius:Math.min(26,6+Math.sqrt(v)*2.4),color:'#6366f1',weight:1.5,fillColor:'#6366f1',fillOpacity:.28})
     .addTo(leafletMap).bindPopup(`<b>${esc(city)}, ${esc(cc)}</b><br>${fmt(v)} requests<br><i>Approximate · IP-based</i>`)});
  geoEvs.forEach(g=>{L.marker([g.latitude,g.longitude],{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;background:#f43f5e;transform:rotate(45deg);border:2px solid #fff;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',iconSize:[12,12]})})
    .addTo(leafletMap).bindPopup(`<b>Precise GPS (consent-granted)</b><br>±${g.accuracyMeters}m · ${fdate(g.capturedAt)}`)});
  if(byCity.length){const b=L.latLngBounds(byCity.map(([k])=>{const p=k.split('|');return[+p[1],+p[2]]}));leafletMap.fitBounds(b.pad(.25))}
  setTimeout(()=>leafletMap&&leafletMap.invalidateSize(),120);
}

    if(type!=='pixel'){const v=validateDestination(f.dest.value.trim());if(!v.ok)return toast(v.error,'err');dest=v.url}
    let slug=f.slug?.value?.trim()||slugGen();
    if(!/^[a-zA-Z0-9_-]{3,32}$/.test(slug))return toast('Slug must be 3–32 chars: letters, numbers, - or _.','err');
    if(['r','p','g','app','api','report','login','register','admin'].includes(slug.toLowerCase()))return toast('That slug is a reserved path.','err');
    if(db.links.some(l=>l.slug===slug))return toast('Slug already in use. Choose another.','err');
    const linksMine=myLinks();if(linksMine.length>=50)return toast('Link creation limit reached (50) — rate limit.','err');
    const code=trackCode();
    const link={id:crypto.randomUUID(),ownerId:u.id,slug,trackingCode:code,trackingCodeHash:null,destinationUrl:dest||'pixel:',
      title:f.title?.value?.trim()||null,purpose:f.purpose?.value?.trim()||null,linkType:type,status:'active',
      expiresAt:f.expires?.value?new Date(f.expires.value).getTime():null,
      baseUrl:DOMAINS.includes(f.domain?.value)?f.domain.value:null,retentionDays:+(f.retention?.value||u.settings.retentionDays),createdAt:Date.now(),updatedAt:Date.now()};
    link.trackingCodeHash=await sha256(code);const{trackingCode:_tc,...row}=link;
    const{error}=await sb.from('tracking_links').insert(snake(row));
    if(error)return toast(error.code==='23505'?'Slug already in use. Choose another.':error.message,'err');
    db.links.unshift(link);
    toast('Tracking link created');ui.q='';route();
    setTimeout(()=>{const c=link.trackingCode;modal(`<div class="text-center">
      <div class="stat-ic bg-emerald-50 dark:bg-emerald-500/10 text-emerald-500 mx-auto mb-3">${ic('check','w-5 h-5')}</div>
      <h3 class="font-extrabold text-[16px] mb-1">Link created</h3>
      <p class="text-[12.5px] text-ink-400 mb-4">Save your tracking code — it's stored hashed and shown here once.</p>
      <div class="rounded-xl bg-ink-50 dark:bg-ink-950 border border-ink-200 dark:border-ink-800 p-3 mono text-[13px] font-bold text-brand-600 dark:text-brand-400 mb-2">${c}</div>
      <button onclick="copyText('${c}','Tracking code copied')" class="btn-ghost w-full py-2 text-[12.5px] mb-2">${ic('copy','w-4 h-4')}Copy tracking code</button>
      <button onclick="closeModal();Actions.openAnalytics('${link.id}')" class="btn-primary w-full py-2.5 text-[13px]">View Analytics</button></div>`)},350);
  },
  toggleLink(id){const l=db.links.find(x=>x.id===id);if(!l)return;
    if(l.ownerId!==me().id&&!isAdmin())return toast('Not authorized.','err');
    l.status=l.status==='active'?'disabled':'active';l.updatedAt=Date.now();
    db.audit.push({id:uid(12),actorId:me().id,action:'link.'+l.status,resourceType:'tracking_link',resourceId:id,createdAt:Date.now()});save();toast('Link '+l.status);route()},
  deleteLink(id){const l=db.links.find(x=>x.id===id);if(!l)return;
    modal(`<h3 class="font-extrabold text-[16px] mb-2">Delete this link?</h3><p class="text-[13px] text-ink-500 mb-5">The link and all its events will be permanently removed. This respects retention/deletion policy and cannot be undone.</p>
    <div class="flex gap-2"><button onclick="closeModal()" class="btn-ghost flex-1 py-2.5 text-[13px]">Cancel</button>
    <button onclick="Actions.confirmDelete('${id}')" class="btn-danger flex-1 py-2.5 text-[13px]">Delete permanently</button></div>`)},
  confirmDelete(id){db.links=db.links.filter(l=>l.id!==id);db.events=db.events.filter(e=>e.linkId!==id);
    db.geoEvents=db.geoEvents.filter(g=>g.trackingLinkId!==id);db.consents=db.consents.filter(c=>c.trackingLinkId!==id);
    db.audit.push({id:uid(12),actorId:me().id,action:'link.delete',resourceType:'tracking_link',resourceId:id,createdAt:Date.now()});save();closeModal();toast('Link deleted');route()},
  qr(id){const l=db.links.find(x=>x.id===id);const url=l.linkType==='geolocation'?geoURL(l):shortURL(l);
    modal(`<div class="text-center"><h3 class="font-extrabold text-[16px] mb-4">QR code</h3><div id="qrbox" class="flex justify-center mb-4"></div>
    <div class="mono text-[11.5px] text-ink-400 break-all mb-4">${esc(url)}</div>
    <button onclick="closeModal()" class="btn-ghost w-full py-2.5 text-[13px]">Close</button></div>`);
    if(typeof QRCode!=='undefined')new QRCode($('#qrbox'),{text:url,width:180,height:180,colorDark:document.documentElement.classList.contains('dark')?'#e2e8f0':'#0f172a'});
    else $('#qrbox').innerHTML='<p class="text-[12px] text-ink-400">QR library unavailable offline.</p>'},
  async codeAccess(e){e.preventDefault();const code=e.target.code.value.trim().toUpperCase();
    // rate limit enumeration attempts
    const k='ipt_code_attempts';const a=JSON.parse(sessionStorage.getItem(k)||'{"n":0,"t":0}');
    if(Date.now()-a.t>6e4){a.n=0;a.t=Date.now()}a.n++;sessionStorage.setItem(k,JSON.stringify(a));
    if(a.n>5)return toast('Too many attempts. Try again in a minute. (rate limit)','err');
    const h=await sha256(code);const l=db.links.find(x=>x.trackingCodeHash===h);
    if(!l)return toast('Invalid or unauthorized tracking code.','err'); // generic error — no enumeration signal
    if(l.ownerId!==me().id&&!isAdmin())return toast('Invalid or unauthorized tracking code.','err');
    this.openAnalytics(l.id)},
  openAnalytics(id){const l=db.links.find(x=>x.id===id);if(!l)return toast('Link not found.','err');
    if(l.ownerId!==me()?.id&&!isAdmin())return toast('Access denied.','err');
    ui.analyticsLink=id;ui.tab='overview';ui.page=1;ui.q='';ui.deviceFilter=ui.typeFilter='';location.hash='#/app/analytics/'+id;route()},
  exportEvents(id){const l=db.links.find(x=>x.id===id);if(!l||(l.ownerId!==me().id&&!isAdmin()))return toast('Export not authorized.','err');
    const evs=db.events.filter(e=>e.linkId===id);
    download(`events-${l.slug}.csv`,toCSV(evs,[['timestamp',e=>new Date(e.occurredAt).toISOString()],['ip_masked','ipMasked'],['country','country'],['region','region'],['city','city'],['device','deviceType'],['browser','browser'],['os','operatingSystem'],['referrer','referrer'],['language','language'],['utm_source','utm_source'],['utm_medium','utm_medium'],['utm_campaign','utm_campaign'],['type','eventType']]),'text/csv');
    db.audit.push({id:uid(12),actorId:me().id,action:'analytics.export',resourceType:'tracking_link',resourceId:id,createdAt:Date.now()});save();toast('CSV exported (IPs masked)')},
  exportFiltered(){toast('Use the per-link export for authorized CSV downloads.','warn')},
  shareLocation(id){const l=PL[id];const st=$('#geoStatus');const btn=$('#shareBtn');
    const show=(msg,kind)=>{st.className=`mt-4 rounded-xl px-4 py-3 text-[12.5px] ${kind==='err'?'bg-rose-50 dark:bg-rose-500/10 text-rose-600':'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600'}`;st.textContent=msg};
    if(!('geolocation' in navigator)){show('Your browser does not support geolocation. You can continue without sharing.','err');return}
    btn.disabled=true;btn.innerHTML='Requesting permission…';
    navigator.geolocation.getCurrentPosition(async pos=>{
      const r=await pub({action:'geo',linkId:id,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:Math.round(pos.coords.accuracy||0)});
      if(r.error){btn.disabled=false;btn.innerHTML='Share My Location';return show(r.error,'err')}
      show(`Thank you — location shared (±${Math.round(pos.coords.accuracy||0)}m). Redirecting…`);
      setTimeout(()=>location.href=l.destinationUrl,1600);
    },err=>{btn.disabled=false;btn.innerHTML='Share My Location';
      const m={1:'Permission denied. No location was collected — and we won\u2019t ask again this session. You can continue below.',2:'Location unavailable. No data collected.',3:'The request timed out. No data collected.'}[err.code]||'Could not get location. No data collected.';
      show(m,'err');sessionStorage.setItem('ipt_geo_declined_'+id,'1')},
    {enableHighAccuracy:true,timeout:10000,maximumAge:0})},
  skipLocation(id){const l=PL[id];toast('Continuing without location');setTimeout(()=>location.href=l.destinationUrl,600)},
  async submitReport(e,linkId){e.preventDefault();const f=e.target;
    const r=await pub({action:'report',linkId,reason:f.reason.value,description:f.description.value.trim()});if(r.error)return toast(r.error,'err');toast('Report submitted for manual review');
    mount(pubShell(`<div class="card p-8 text-center"><div class="stat-ic bg-emerald-50 dark:bg-emerald-500/10 text-emerald-500 mx-auto mb-4">${ic('check','w-5 h-5')}</div>
      <h1 class="font-extrabold text-lg">Report received</h1><p class="text-[13px] text-ink-400 mt-2">A moderator will review this destination. Thank you for helping keep links safe.</p>
      <a href="#/" class="btn-ghost px-5 py-2.5 text-[13px] mt-5">Back to IP Tracker</a></div>`))},
  moderate(reportId,action){if(!isAdmin())return toast('Admins only.','err');
    const r=db.reports.find(x=>x.id===reportId);const l=db.links.find(x=>x.id===r.trackingLinkId);if(!r)return;
    r.status=action==='dismiss'?'dismissed':'actioned';r.reviewedBy=me().id;r.reviewedAt=Date.now();
    if(l&&action==='disable')l.status='disabled';if(l&&action==='remove')l.status='removed';
    db.audit.push({id:uid(12),actorId:me().id,action:'moderation.'+action,resourceType:'tracking_report',resourceId:reportId,createdAt:Date.now()});save();
    toast('Report '+r.status+(l&&action!=='dismiss'?' · link '+l.status:''));route()},
  saveProfile(e){e.preventDefault();const u=me();u.displayName=e.target.name.value.trim()||u.displayName;u.settings.retentionDays=+e.target.retention.value;save();toast('Profile saved');route()},
  exportAll(){const u=me();const data={profile:{displayName:u.displayName,email:u.email,role:u.role,createdAt:u.createdAt},
    links:myLinks(),events:db.events.filter(e=>myLinks().some(l=>l.id===e.linkId)),geoEvents:db.geoEvents.filter(g=>myLinks().some(l=>l.id===g.trackingLinkId))};
    download('ip-tracker-export.json',JSON.stringify(data,null,2),'application/json');toast('Your data was exported')},
  purgeEvents(){modal(`<h3 class="font-extrabold text-[16px] mb-2">Delete all your event data?</h3><p class="text-[13px] text-ink-500 mb-5">All analytics events and GPS records for your links will be permanently erased. Links themselves remain.</p>
    <div class="flex gap-2"><button onclick="closeModal()" class="btn-ghost flex-1 py-2.5 text-[13px]">Cancel</button>
    <button onclick="Actions.confirmPurge()" class="btn-danger flex-1 py-2.5 text-[13px]">Erase events</button></div>`)},
  confirmPurge(){const ids=myLinks().map(l=>l.id);db.events=db.events.filter(e=>!ids.includes(e.linkId));db.geoEvents=db.geoEvents.filter(g=>!ids.includes(g.trackingLinkId));db.consents=db.consents.filter(c=>!ids.includes(c.trackingLinkId));save();closeModal();toast('Event data erased');route()},
  deleteAccount(){modal(`<h3 class="font-extrabold text-[16px] mb-2">Delete your account?</h3><p class="text-[13px] text-ink-500 mb-5">Your profile, links, events and consents will be permanently deleted.</p>
    <div class="flex gap-2"><button onclick="closeModal()" class="btn-ghost flex-1 py-2.5 text-[13px]">Cancel</button>
    <button onclick="Actions.confirmDelAcct()" class="btn-danger flex-1 py-2.5 text-[13px]">Delete account</button></div>`)},
  confirmDelAcct(){const u=me();const ids=myLinks().map(l=>l.id);
    db.events=db.events.filter(e=>!ids.includes(e.linkId));db.geoEvents=db.geoEvents.filter(g=>!ids.includes(g.trackingLinkId));
    db.consents=db.consents.filter(c=>!ids.includes(c.trackingLinkId));db.links=db.links.filter(l=>l.ownerId!==u.id);
    db.users=db.users.filter(x=>x.id!==u.id);save();logout();closeModal();toast('Account deleted')},
};

/* -------- modal -------- */
function modal(html){$('#modal-root').innerHTML=`<div class="fixed inset-0 z-[9998] flex items-center justify-center p-5">
  <div class="absolute inset-0 bg-ink-950/55 backdrop-blur-sm" onclick="closeModal()"></div>
  <div class="relative card p-6 w-full max-w-sm fadein">${html}</div></div>`}
window.closeModal=()=>{$('#modal-root').innerHTML=''};

/* ================================================================
   ROUTER
================================================================ */
let lastHash=null;
function route(){
  const hash=location.hash||'#/';
  if(hash!==lastHash){ui.mobileNav=false;ui.notif=false;ui.profileMenu=false;lastHash=hash}
 const seg=hash.slice(1).split('/').filter(Boolean);
  document.title='IP Tracker — Track Visits. Understand Traffic. Respect Privacy.';
  if(seg[0]==='r'&&seg[1])return vRedirect(seg[1]);
  if(seg[0]==='g'&&seg[1])return vGeoConsent(seg[1]);
  if(seg[0]==='report'&&seg[1])return vReport(seg[1]);
  if(seg[0]==='login')return mount(vLogin());
  if(seg[0]==='register')return mount(vRegister());
  if(seg[0]==='app'){
    if(!me()){location.hash='#/login';return}
    const sub=seg[1]||'overview';
    if(sub==='overview')return vOverview();
    if(sub==='urls')return vURLs();
    if(sub==='pixels')return vPixels();
    if(sub==='geo')return vGeo();
    if(sub==='analytics'&&seg[2]){const l=db.links.find(x=>x.id===seg[2]);
      if(!l||(l.ownerId!==me().id&&!isAdmin()))return vAnalyticsAccess();return vAnalyticsDash(l)}
    if(sub==='analytics')return vAnalyticsAccess();
    if(sub==='logs')return vLogs();
    if(sub==='reports')return vReports();
    if(sub==='admin')return vAdmin();
    if(sub==='settings')return vSettings();
    return vOverview();
  }
  mount(vLanding());
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
Object.assign(Actions,{
  async register(e){e.preventDefault();const f=e.target;const r=await register(f.name.value,f.email.value,f.password.value);
    if(!r.ok)return toast(r.error,'err');
    if(r.confirm){toast('Check your email to confirm your account, then sign in.');location.hash='#/login';return}
    toast('Account created — welcome!');location.hash='#/app/overview';route()},
  async forgot(email){if(!email)return toast('Enter your email first.','warn');
    const{error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+location.pathname});
    toast(error?error.message:'If that account exists, a reset link is on its way.',error?'err':'ok')},
  async newPass(e){e.preventDefault();const{error}=await sb.auth.updateUser({password:e.target.p.value});if(error)return toast(error.message,'err');
    closeModal();toast('Password updated');await hydrate();location.hash='#/app/overview';route()},
  async toggleLink(id){const l=db.links.find(x=>x.id===id);if(!l)return;const st=l.status==='active'?'disabled':'active';
    const{error}=await sb.from('tracking_links').update({status:st,updated_at:new Date().toISOString()}).eq('id',id);
    if(error)return toast(error.message,'err');l.status=st;toast('Link '+st);route()},
  async confirmDelete(id){const{error}=await sb.from('tracking_links').delete().eq('id',id);if(error)return toast(error.message,'err');
    db.links=db.links.filter(l=>l.id!==id);db.events=db.events.filter(e=>e.linkId!==id);db.geoEvents=db.geoEvents.filter(g=>g.trackingLinkId!==id);
    db.consents=db.consents.filter(c=>c.trackingLinkId!==id);closeModal();toast('Link deleted');route()},
  async confirmPurge(){const ids=myLinks().map(l=>l.id);
    if(ids.length){const r=await Promise.all([sb.from('tracking_events').delete().in('link_id',ids),sb.from('geolocation_events').delete().in('tracking_link_id',ids),sb.from('geolocation_consents').delete().in('tracking_link_id',ids)]);
      const er=r.find(x=>x.error);if(er)return toast(er.error.message,'err')}
    db.events=db.events.filter(e=>!ids.includes(e.linkId));db.geoEvents=db.geoEvents.filter(g=>!ids.includes(g.trackingLinkId));
    db.consents=db.consents.filter(c=>!ids.includes(c.trackingLinkId));closeModal();toast('Event data erased');route()},
  async confirmDelAcct(){const{error}=await sb.rpc('delete_my_account');if(error)return toast(error.message,'err');closeModal();await logout();toast('Account deleted')},
  async saveProfile(e){e.preventDefault();const u=me(),n=e.target.name.value.trim()||u.displayName,r=+e.target.retention.value;
    const{error}=await sb.from('profiles').update({display_name:n,retention_days:r}).eq('id',u.id);if(error)return toast(error.message,'err');
    u.displayName=n;u.settings.retentionDays=r;toast('Profile saved');route()},
  async moderate(id,action){if(!isAdmin())return toast('Admins only.','err');
    const r=db.reports.find(x=>x.id===id);if(!r)return;const l=db.links.find(x=>x.id===r.trackingLinkId);
    const st=action==='dismiss'?'dismissed':'actioned',now=new Date().toISOString();
    const q=[sb.from('tracking_reports').update({status:st,reviewed_by:me().id,reviewed_at:now}).eq('id',id)];
    if(l&&action!=='dismiss')q.push(sb.from('tracking_links').update({status:action==='disable'?'disabled':'removed',updated_at:now}).eq('id',l.id));
    const er=(await Promise.all(q)).find(x=>x.error);if(er)return toast(er.error.message,'err');
    r.status=st;r.reviewedBy=me().id;r.reviewedAt=Date.now();if(l&&action==='disable')l.status='disabled';if(l&&action==='remove')l.status='removed';
    toast('Report '+st+(l&&action!=='dismiss'?' · link '+l.status:''));route()}
});
document.addEventListener('click',e=>{if((ui.notif||ui.profileMenu)&&!e.target.closest('[data-dd]')){ui.notif=false;ui.profileMenu=false;route()}});
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')modal(`<h3 class="font-extrabold text-[16px] mb-3">Set a new password</h3><form onsubmit="Actions.newPass(event)"><input name="p" type="password" minlength="8" required class="input mb-3" placeholder="New password (min. 8 characters)"/><button class="btn-primary w-full py-2.5 text-[13px]">Update password</button></form>`)});
setInterval(async()=>{const a=document.activeElement?.tagName;
  if(cur&&/^#\/app\/(overview|logs|analytics\/)/.test(location.hash)&&!['INPUT','TEXTAREA','SELECT'].includes(a)&&!$('#modal-root').firstChild){await hydrate();route()}},60000);
(async()=>{try{await hydrate()}catch(e){console.error(e);toast('Could not reach the database. Check your Supabase URL and key.','err')}
  if(cur&&!location.hash)location.hash='#/app/overview';route()})();
</script>
